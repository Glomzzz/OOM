name: "Deploy"
on:
  pull_request:
  push:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
env:
  # Published release; keep synchronized with flake.nix / flake.lock.
  TYPSITE_TAG: "0.1.8-55"
  TYPSITE_SHA256: "a33ab5402fc448a8ddd2390678ad986242cb0e79c2d2ca8847dfe7c3fa8cac04"
  TYPSITE_BIN: "./.build-tools/typsite"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TYPST_FONT_PATHS: "./.typsite/assets/fonts"
      TYPST_PACKAGE_PATH: "${{ github.workspace }}/.typst-packages"
    steps:
      - uses: actions/checkout@v4
      - name: Test production build helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - name: Download pinned Typsite 0.1.8 release
        run: |
          mkdir -p .build-tools
          curl --fail --location --retry 3 \
            "https://github.com/Glomzzz/typsite/releases/download/$TYPSITE_TAG/typsite-x86_64-unknown-linux-gnu" \
            --output "$TYPSITE_BIN"
          printf '%s  %s\n' "$TYPSITE_SHA256" "$TYPSITE_BIN" | sha256sum --check --strict
          chmod +x "$TYPSITE_BIN"
      - name: Build production site
        run: |
          "$TYPSITE_BIN" --version
          typst --version
          python3 scripts/build.py --typsite "$TYPSITE_BIN"
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
