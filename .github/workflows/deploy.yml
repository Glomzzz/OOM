name: "Deploy to Cloudflare Pages"
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
env:
  # Published release; keep synchronized with flake.nix / flake.lock.
  TYPSITE_TAG: "0.1.8-55"
  TYPSITE_SHA256: "a33ab5402fc448a8ddd2390678ad986242cb0e79c2d2ca8847dfe7c3fa8cac04"
  TYPSITE_BIN: "./.build-tools/typsite"
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TYPST_FONT_PATHS: "./.typsite/assets/fonts"
      TYPST_PACKAGE_PATH: "${{ github.workspace }}/.typst-packages"
    steps:
      - uses: actions/checkout@v4
      - name: Test production build helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - name: Download pinned Typsite 0.1.8 release
        run: |
          mkdir -p .build-tools
          curl --fail --location --retry 3 \
            "https://github.com/Glomzzz/typsite/releases/download/$TYPSITE_TAG/typsite-x86_64-unknown-linux-gnu" \
            --output "$TYPSITE_BIN"
          printf '%s  %s\n' "$TYPSITE_SHA256" "$TYPSITE_BIN" | sha256sum --check --strict
          chmod +x "$TYPSITE_BIN"
      - name: Build production site
        run: |
          "$TYPSITE_BIN" --version
          typst --version
          python3 scripts/build.py --typsite "$TYPSITE_BIN"
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./publish
          if-no-files-found: error
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: publish
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set the CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set the CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "4.151.1"
          command: pages deploy publish --project-name=oom --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
