<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{page-title}</title>
        <link rel="stylesheet" href="../assets/fonts.css" />
        <link rel="stylesheet" href="../assets/schemas/page.css" />
        <link rel="stylesheet" href="../assets/math-block.css" />
        <link rel="stylesheet" href="../assets/math-inline.css" />
        <link rel="stylesheet" href="../assets/mathyml.css" />
        <link rel="stylesheet" href="../assets/math-accessibility.css" />
        <link rel="stylesheet" href="../assets/inline-fold.css" />
        <link rel="stylesheet" href="../assets/theorem.css" />
        <link rel="stylesheet" href="../assets/embed.css" />
        <link rel="stylesheet" href="../assets/site-title.css" />
        <script defer src="../assets/site-links.js"></script>
        <script defer src="../assets/math-accessibility.js"></script>
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin="true"
        />
        <!-- Latin faces are served locally; Chinese prose uses a Song-style serif. -->
        <link
            href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&amp;display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <header class="header" parent="{has-parent}" lang="zh-CN">
            <nav class="nav">
                <div class="logo">
                    <a
                        href="{slug@parent}"
                        title="{page-title@parent} [{slug@parent}]"
                        >« {title@parent}</a
                    >
                </div>
            </nav>
        </header>
        <div id="grid-wrapper" sidebar="{sidebar}">
            <!-- Typsite 0.1.7 regenerates the outer html tag; mark the content too. -->
            <article lang="zh-CN">
                <section class="block page-root" id="{slug@anchor}" data-slug="{slug}" data-taxon="{taxon}" data-reference-id="{reference-id}" data-legacy-reference-id="{legacy-reference-id}">
                    <details open>
                        <summary>
                            <header
                                class="top-header"
                                show-metadata="{show-metadata}"
                            >
                                <h1>
                                    <span class="taxon" data-taxon="{taxon}" lang="en">{taxon}.</span>
                                    <metadata get="title" />
                                </h1>
                                <div class="metadata">
                                    <ul>
                                        <li class="meta-item">
                                            <metadata get="author" />
                                        </li>
                                        <li class="meta-item">
                                            <metadata get="date" />
                                        </li>
                                        <li class="meta-item">
                                            <span class="link local"
                                                ><a
                                                    href="/about/"
                                                    title="About [/about/]"
                                                    >About</a
                                                ></span
                                            >
                                        </li>
                                    </ul>
                                </div>
                            </header>
                        </summary>
                        <p class="section-description">{description}</p>
                        <content />
                        <!-- Where to put Content-->
                    </details>
                </section>
                <div class="page-footer">
                    <footer />
                    <p class="colophon" lang="en">
                        Built with
                        <a class="link external" href="https://github.com/Glomzzz/typsite/">Typsite</a>.
                    </p>
                </div>
            </article>
            <!-- The checkbox must stay before the button and the sidebar: CSS uses sibling selectors. -->
            <input
                type="checkbox"
                id="toc-toggle"
                class="toc-toggle"
                aria-label="Toggle table of contents"
                aria-controls="toc"
            />
            <span class="toc-button" aria-hidden="true"></span>
            <sidebar />
            <!-- Where to put sidebar -->
        </div>
    </body>
</html>
