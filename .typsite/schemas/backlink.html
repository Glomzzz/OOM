<head>
</head>
<!--
Inline var could be used:
- {slug} - The slug of the backlink article.
- <content/> - The content of the backlink article.
- Any meta contents of this backlink article.
-->

<body>
  <p class="backlink">
    <a class="backlink-link" href="{slug}" title="{page-title} [{slug-display}]">
      <span class="taxon" data-taxon="{taxon}" lang="en">{taxon}.</span>
      <span class="backlink-title">{title}</span>
      <span class="backlink-slug">[{slug-display}]</span>
    </a>
  </p>
</body>
