<head>
</head>
<!--
Inline var could be used:
- {slug} - The slug of the backlink article.
- <content/> - The content of the backlink article.
- Any meta contents of this backlink article.
-->

<body>
  <p class="backlink">
    <span class="taxon" data-taxon="{taxon}">[{taxon}]</span>
    <span class="link local"><a href="{slug}" title="{page-title}">{title}</a></span>
    <a class="slug" href="{slug}">[{slug-display}]</a>
  </p>
</body>
